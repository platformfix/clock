name: e2e

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --snapshot --clean -o clock

      - name: Build the image
        run: docker build -t clock:ci .

      - name: Run the container and capture output
        run: |
          docker run -d --rm --name clock-e2e clock:ci
          sleep 3
          docker logs clock-e2e > /tmp/clock-output.txt
          cat /tmp/clock-output.txt

      - name: Verify multiple distinct RFC3339 timestamps were printed
        run: |
          lines=$(grep -cE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' /tmp/clock-output.txt || true)
          if [ "$lines" -lt 2 ]; then
            echo "expected at least 2 RFC3339 timestamp lines, got $lines"
            exit 1
          fi
          distinct=$(sort -u /tmp/clock-output.txt | wc -l)
          if [ "$distinct" -lt 2 ]; then
            echo "expected at least 2 DISTINCT timestamps (proving it ticks, not just prints once), got $distinct"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker logs clock-e2e || true

      - name: Verify graceful shutdown on SIGTERM
        run: |
          waitfile=$(mktemp)
          # Subscribe to the container's exit status before requesting the
          # stop, so we capture the exit code that `main.go` returns with
          # after handling SIGTERM, before `--rm` removes the container.
          docker wait clock-e2e > "$waitfile" &
          wait_pid=$!
          docker stop clock-e2e
          wait "$wait_pid"
          code=$(cat "$waitfile")
          rm -f "$waitfile"
          echo "container exit code: $code"
          if [ "$code" != "0" ]; then
            echo "expected exit code 0 (clean shutdown after SIGTERM), got $code"
            exit 1
          fi

      - name: Clean up
        if: always()
        run: docker stop clock-e2e 2>/dev/null || true
